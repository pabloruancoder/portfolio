<style>
:root{--face:#c0c0c0;--hi:#fff;--lt:#dfdfdf;--sh:#808080;--dk:#000;--nav1:#000080;--nav2:#1084d0;
  --ui:"Tahoma","MS Sans Serif",Verdana,sans-serif;--mono:"VT323",monospace;--px:"Press Start 2P",monospace;}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:var(--ui);
  background:#008080;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(160deg,#0a8f8f,#008080 45%,#00625f);background-size:5px 5px,100% 100%;
  -webkit-font-smoothing:none;color:#000}
.scan{position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);opacity:.5}
.win{width:min(560px,100%);background:var(--face);position:relative;z-index:2;
  border:2px solid;border-color:var(--lt) var(--dk) var(--dk) var(--lt);
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh),5px 5px 0 rgba(0,0,0,.35)}
.tbar{height:26px;display:flex;align-items:center;gap:7px;padding:0 5px;
  background:linear-gradient(90deg,var(--nav1),var(--nav2));color:#fff;font-weight:bold;font-size:12px}
.tbar svg{width:16px;height:16px}
.bd{padding:26px 24px 24px;text-align:center}
h1{font-family:var(--px);font-size:clamp(15px,4.4vw,21px);line-height:1.6;color:#000080;
  text-shadow:3px 3px 0 #d4d0c8,4px 4px 0 var(--sh);margin-bottom:18px}
p{font-size:13px;line-height:1.75;margin-bottom:14px}
.novo{font-family:var(--mono);font-size:23px;word-break:break-all;padding:10px;margin:16px 0;
  background:#000;color:#0f0;border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.b95{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#000;
  background:var(--face);border:2px solid;border-color:var(--lt) var(--dk) var(--dk) var(--lt);
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh),2px 2px 0 rgba(0,0,0,.28);
  padding:13px 26px;font-size:14px;font-weight:bold;font-family:var(--ui);cursor:pointer}
.b95:active{border-color:var(--dk) var(--lt) var(--lt) var(--dk);box-shadow:inset 1px 1px 0 var(--sh)}
.b95.wa{background:#1faa53;color:#fff;border-color:#7ee6a5 #063d1c #063d1c #7ee6a5;
  box-shadow:inset 1px 1px 0 #86efac,inset -1px -1px 0 #0b5c2c,2px 2px 0 rgba(0,0,0,.28)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.barra{height:20px;margin:18px 0 6px;padding:2px;display:flex;gap:2px;overflow:hidden;background:#fff;
  border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh)}
.barra i{flex:0 0 13px;background:var(--nav1);opacity:0;animation:enche .5s linear forwards}
@keyframes enche{to{opacity:1}}
.sbar{display:flex;gap:4px;padding:4px;border-top:1px solid var(--lt)}
.sbar div{border:1px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);padding:4px 9px;font-size:11px;color:#333}
.sbar div:first-child{flex:1;text-align:left}
@media (prefers-reduced-motion:reduce){.barra i{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="scan"></div>
<div class="win">
  <div class="tbar">
    <svg viewBox="0 0 32 32"><path d="M2 4h28v20H2z" fill="#000"/><path d="M3 5h26v18H3z" fill="#c0c0c0"/><path d="M5 7h22v14H5z" fill="#000080"/><path d="M6 8h9v4H6z" fill="#00a2a2"/><path d="M12 24h8v3h-8z" fill="#808080"/><path d="M8 27h16v3H8z" fill="#000"/></svg>
    mudanca.exe
  </div>
  <div class="bd">
    <h1>MUDEI DE<br>ENDEREÇO</h1>
    <p>Este era o meu portfólio antigo. Ele foi <b>totalmente reconstruído</b> —
       agora tem os projetos novos, as extensões publicadas e bem mais coisa.</p>
    <div class="novo" id="destino">https://pabloruan.netlify.app</div>
    <div class="barra" id="barra"></div>
    <p style="font-size:11.5px;color:#444" id="aviso">Te levo pra lá em <b id="seg">6</b> segundos…</p>
    <div class="acts">
      <a class="b95" href="https://pabloruan.netlify.app" id="ir">Ir agora →</a>
      <a class="b95 wa" href="https://wa.me/5586981482590?text=Ol%C3%A1%20Pablo!%20Vim%20pelo%20seu%20portf%C3%B3lio." target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
  <div class="sbar"><div>Pablo Ruan — desenvolvedor full-stack</div><div>301</div></div>
</div>
<script>
(function(){
  var destino=document.getElementById('ir').getAttribute('href');
  document.getElementById('destino').textContent=destino;
  var barra=document.getElementById('barra');
  for(var i=0;i<24;i++){ var c=document.createElement('i'); c.style.animationDelay=(i*250)+'ms'; barra.appendChild(c); }
  var s=6, el=document.getElementById('seg');
  var t=setInterval(function(){
    s--; el.textContent=Math.max(0,s);
    if(s<=0){ clearInterval(t); location.replace(destino); }
  },1000);
})();
</script>
</body>
</html>
